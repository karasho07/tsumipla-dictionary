<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>辞書の運営画面 | 積みプラ手帳</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1320;color:#eaf1f9;font:16px/1.7 system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:32px 20px}h1{font-size:28px;margin:4px 0}h2{font-size:21px}p{margin:8px 0;color:#b8c9dc}button,input,select{font:inherit}button{border:1px solid #48617a;border-radius:10px;background:#17273b;color:#eaf1f9;padding:10px 16px;cursor:pointer}button.primary{background:#2cc6b3;color:#071b20;border:0;font-weight:700}button:disabled{opacity:.45;cursor:wait}a{color:#8ce4d7}.box{padding:20px;border:1px solid #30465d;border-radius:16px;background:#111e30;margin:18px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.tag{border-radius:6px;padding:2px 8px;font-size:13px;background:#24374b}.ready{color:#8ce4d7}.held{color:#ffd099}article{padding:18px 0;border-bottom:1px solid #30465d}article:last-child{border:0}label.row{display:flex;gap:12px;align-items:flex-start}input[type=checkbox]{width:22px;height:22px;margin-top:5px}h3{font-size:18px;margin:0}.meta{margin-left:34px;font-size:14px}#message{white-space:pre-wrap;color:#f8d295}#error{white-space:pre-wrap;color:#ffb8b8}input[type=search]{width:100%;border-radius:10px;border:1px solid #48617a;background:#0b1320;color:inherit;padding:10px}small{color:#b8c9dc}.links{display:flex;gap:18px;flex-wrap:wrap}.sticky{position:sticky;top:0;background:#111e30;padding:12px 0;z-index:1}footer{margin-top:30px;color:#b8c9dc}code{overflow-wrap:anywhere}
</style></head><body><main><small>積みプラ手帳 · 運営用 / このパソコンのみ</small><h1>辞書に追加する商品を確認</h1><p>公式情報を収集 → 候補を確認 → 承認した商品だけ書き出し</p>
<section class="box"><h2>現在の辞書</h2><p id="catalog">読み込み中…</p><div class="actions"><button class="primary" id="collect">公式情報を収集する</button><button id="sync">最新辞書と毎日の候補を取得</button><button id="refresh">状態を更新</button><button id="import">候補ファイルを取り込む</button><input type="file" id="file" accept="application/json,.json" hidden></div><p id="message" role="status"></p><p id="error" role="alert"></p><small>収集元にJANが未掲載の商品は追加できません。発売日の月だけが分かる場合も日付は推測しません。毎日の自動収集はGitHubへの初回設定後に動きます。</small></section>
<section class="box"><h2>追加・補完の候補</h2><p id="summary"></p><div class="sticky"><input id="search" type="search" placeholder="商品名・JANで候補を絞る" aria-label="商品名・JANで検索"><div class="actions"><button id="approve">選択した候補を承認</button><button id="hold">選択した候補を保留</button><button class="primary" id="export">承認分の配信ファイルを作る</button></div></div><div id="items"></div></section>
<footer>承認しただけでは利用者の辞書は変わりません。配信ZIPを展開してGitHubへアップロードすると更新が届きます。既存商品ID・JAN対応を削除・変更する操作はありません。</footer></main><script src="/admin.js"></script></body></html>
